# vim-family: vim and neovim, hooks-only (D30). No key map, ever: vim
# already moves with hjkl, and this group exists so the transition hook and
# the indicator can tell an outer keyboard layer which mode vim is in.
#
# Verified against vim 8.2, 9.0, 9.1 and nvim 0.6.1, 0.7.2, 0.9.5, 0.12.5
# (tests/fixtures/vim, tests/fixtures/nvim). What the screen shows:
#   - showmode markers on the LAST row, col 0, in every layout (cmdheight 1
#     or 2, with or without a status line): "-- INSERT --", "-- VISUAL
#     LINE --", "-- (insert) --" after C-o, "-- Keyword completion (^N^P)
#     match 1 of 3" while completing. Only the last row is read: in vim
#     without a status line, row -2 is buffer text, and a Lua or SQL
#     comment there starts with "-- " too.
#   - the ruler "12,5-8   All", 18 columns from the right edge: on the last
#     row in vim, in the status line (row -2) in nvim and in split windows.
#   - a ":" / "/" / "?" command line on the last row, or on row -2 when
#     cmdheight = 2 (then the last row is empty), with the cursor on it.
#
# Translations: the alternations below cover every language vim and the
# distros' neovim ship (generated by scripts/fixtures/vim-markers.py
# --regex from tests/fixtures/vim/markers.json; TestVimMarkers checks this
# file against that data). Insert-like markers need no list: any other
# "-- X" marker on the last row is read as insert (completion submodes,
# languages not listed). Upstream neovim release builds carry no
# translations and always show English.
#
# Known gaps (README "vim and neovim"): showmode off with the ruler on
# reads as normal in every mode (cursor shape can veto that where tmux
# reports it, tmux 3.6+); a statusline plugin that replaces the ruler
# (lualine, airline) leaves only the tilde column, so the mode is unknown
# unless a marker shows; nvim cmdheight=0 has no marker row; plain vim's
# :terminal shows no marker (reads as normal); operator-pending and "r"
# read as normal (both commanding, which is the right bucket).
description = "vim and neovim: showmode markers, ruler, tilde column"
modes = ["normal", "visual", "insert", "replace", "select", "command", "terminal"]
translated = true
# Short markers, read only on the last row of a pane identified as vim
# (lint_ignore is not inherited: vim.toml and nvim.toml repeat it).
lint_ignore = ["under-specified"]

[buckets]
typing     = ["insert", "replace", "select", "command", "terminal"]
commanding = ["normal", "visual"]

[match]
requires_alt_screen = true
combine             = "weighted"
threshold           = 100

  # The ruler, at its fixed place: vim's last row, or the status line
  # above the command line (nvim, split windows; row -3 with cmdheight=2).
  # Enough on its own: a buffer that fills the window shows no tildes, and
  # the file message is gone after the first keystroke.
  #
  # Every clause here counts from the bottom, so once a pane is known to be
  # vim only the bottom 12 rows are captured (@modal_capture_rows).
  [[match.clause]]
  regex  = '[0-9]+,[0-9]+(-[0-9]+)? +([0-9]{1,3}%|Весь текст|Tüm Belge|Окончание|Comienzo|Wszystko|Začiatok|Nederst|Začátek|Ãsszes|Наверху|Anfang|Koniec|Teteje|Tất cả|Všetko|Øverst|Начало|Alles|Bodem|Final|Konec|Loppu|Supro|Вгорі|Внизу|Знизу|Alja|Alku|Alla|Baix|Barr|Bott|Bunn|Cuối|Dalt|Ende|Góra|Haut|Kaik|Subo|Todo|Topo|Topp|Tout|Tudo|Uile|Весь|All|Alt|Bas|Baş|Bot|Bun|Cim|Dół|Fim|Fon|Ned|Ond|Son|Top|Tot|Tut|Vše|Øve|Ĉio|Đầu|Врх|Дно|Све|Усе|꼭대기|Bo|先頭|全て|全部|底端|末尾|頂端|顶端|모두|바닥)$'
  rows   = [-3, -1]
  col    = -18
  weight = 100

  # The tilde column below the end of the buffer (^~$ exactly: a bare ^~
  # matches ~/paths and markdown fences). It always reaches down to the
  # last text row, so the bottom of the screen is where to look.
  [[match.clause]]
  regex           = '^~$'
  rows            = [-12, -2]
  min_occurrences = 3
  contiguous      = true
  weight          = 60

  # The file message after opening or writing: "f.txt" 12L, 280B
  [[match.clause]]
  regex  = '^"[^"]+" .*[0-9]'
  row    = -1
  col    = 0
  weight = 40

  # A showmode marker (or the completion line that replaces it).
  [[match.clause]]
  regex  = '^-- \S'
  row    = -1
  col    = 0
  weight = 40

  # The pager and hit-enter prompts replace everything else.
  [[match.clause]]
  regex  = '^(-- Продолжение следует --|-- Pokračovanie --|-- Pokračování --|-- Daha fazla --|-- Tuilleadh --|-- Còn nữa --|-- TovÃ¡bb --|-- Ancora --|-- Więcej --|-- Lisää --|-- Далее --|-- Mais --|-- Meer --|-- Mehr --|-- Mere --|-- More --|-- Plus --|-- meer --|-- Mer --|-- Más --|-- Més --|-- Pli --|-- Још --|-- Ще --|-- 尚有 --|-- 更多 --|-- 継続 --|-- 더 --)( |$)'
  row    = -1
  col    = 0
  weight = 100

  [[match.clause]]
  regex  = '''^(Betätigen Sie die EINGABETASTE oder geben Sie einen Befehl ein|Чтобы продолжить, нажмите клавишу <ENTER> или введите команду|Nyomjon ENTER-t vagy Ã­rjon be egy parancsot a folytatÃ¡shoz|Да бисте наставили, притисните ЕНТЕР или откуцајте команду|Appuyez sur ENTRÉE ou tapez une commande pour continuer|Brúigh ENTER nó cuir ordú isteach le dul ar aghaidh|Naciśnij ENTER lub wprowadź komendę aby kontynuować|Premeu ENTRAR o introduïu una ordre per a continuar|Stlačte ENTER alebo zadajte príkaz pre pokračovanie|Tryk på ENTER eller skriv kommando for at fortsætte|Натисніть ENTER або введіть команду для продовження|Tryck RETUR eller skriv kommando för att fortsätta|Toets ENTER of typ een opdracht om verder te gaan|Нажмите ENTER или введите команду для продолжения|Aperte ENTER ou digite um comando para continuar|Paina enteriä tai kirjoita komento aloittaaksesi|Trykk ENTER eller skriv kommando for å fortsette|Premu ENEN-KLAVON aŭ tajpu komandon por daŭrigi|Pulse INTRO o escriba una orden para continuar|Sürdürmek için ENTER'a basın veya komut girin|Druk ENTER of tik 'n bevel om voort te gaan|Brúigh ENTER nó iontráil ordú le leanúint|Premi INVIO o un comando per proseguire|Press ENTER or type command to continue|続けるにはENTERを押すかコマンドを入力してください|계속하려면 엔터 혹은 명령을 입력하십시오|请按 ENTER 或其它命令继续)$'''
  row    = -1
  col    = 0
  weight = 100

# --- mode rules: first hit wins ---------------------------------------

[[mode_when]]
name  = "more-prompt"
mode  = "normal"
regex = '^(-- Продолжение следует --|-- Pokračovanie --|-- Pokračování --|-- Daha fazla --|-- Tuilleadh --|-- Còn nữa --|-- TovÃ¡bb --|-- Ancora --|-- Więcej --|-- Lisää --|-- Далее --|-- Mais --|-- Meer --|-- Mehr --|-- Mere --|-- More --|-- Plus --|-- meer --|-- Mer --|-- Más --|-- Més --|-- Pli --|-- Још --|-- Ще --|-- 尚有 --|-- 更多 --|-- 継続 --|-- 더 --)( |$)'
row   = -1
col   = 0

[[mode_when]]
name  = "hit-enter-prompt"
mode  = "normal"
regex = '''^(Betätigen Sie die EINGABETASTE oder geben Sie einen Befehl ein|Чтобы продолжить, нажмите клавишу <ENTER> или введите команду|Nyomjon ENTER-t vagy Ã­rjon be egy parancsot a folytatÃ¡shoz|Да бисте наставили, притисните ЕНТЕР или откуцајте команду|Appuyez sur ENTRÉE ou tapez une commande pour continuer|Brúigh ENTER nó cuir ordú isteach le dul ar aghaidh|Naciśnij ENTER lub wprowadź komendę aby kontynuować|Premeu ENTRAR o introduïu una ordre per a continuar|Stlačte ENTER alebo zadajte príkaz pre pokračovanie|Tryk på ENTER eller skriv kommando for at fortsætte|Натисніть ENTER або введіть команду для продовження|Tryck RETUR eller skriv kommando för att fortsätta|Toets ENTER of typ een opdracht om verder te gaan|Нажмите ENTER или введите команду для продолжения|Aperte ENTER ou digite um comando para continuar|Paina enteriä tai kirjoita komento aloittaaksesi|Trykk ENTER eller skriv kommando for å fortsette|Premu ENEN-KLAVON aŭ tajpu komandon por daŭrigi|Pulse INTRO o escriba una orden para continuar|Sürdürmek için ENTER'a basın veya komut girin|Druk ENTER of tik 'n bevel om voort te gaan|Brúigh ENTER nó iontráil ordú le leanúint|Premi INVIO o un comando per proseguire|Press ENTER or type command to continue|続けるにはENTERを押すかコマンドを入力してください|계속하려면 엔터 혹은 명령을 입력하십시오|请按 ENTER 或其它命令继续)$'''
row   = -1
col   = 0

# C-o in insert mode: one normal-mode command, then back to insert.
[[mode_when]]
name  = "insert-pending"
mode  = "normal"
regex = '^-- \([^)]+\) --'
row   = -1
col   = 0

# "-- VISUAL --", "-- VISUAL LINE --", "-- (insert) VISUAL --"
[[mode_when]]
name  = "visual"
mode  = "visual"
regex = '^-- (\([^)]+\) )?(РЕЖИМ ВИЗУАЛЬНЫЙ ПОСИМВОЛЬНЫЙ|РЕЖИМ ВИЗУАЛЬНЫЙ ПОСТРОЧНЫЙ|РЕЖИМ ВИЗУАЛЬНЫЙ БЛОКОВЫЙ|ВИЗУАЛЬНАЯ СТРОКА|WIZUALNY BLOKOWY|WIZUALNY LINIOWY|ВИЗУАЛЬНЫЙ РЕЖИМ|BLOC RADHARCACH|LÍNE RADHARCACH|VIZUÁLNY RIADOK|VIZUÃLIS BLOKK|ВИЗУАЛЬНЫЙ БЛОК|ВИЗУЕЛНА ЛИНИЈА|VISUALE BLOCCO|VISUELLT BLOCK|BLOQUE VISUAL|CHẾ ĐỘ VISUAL|VISUELE REGEL|VISUELL BLOCK|VISUELL BLOKK|VISUELL LINJE|VISUELL ZEILE|VIZUÁLNY BLOK|VIZUÃLIS SOR|ВИЗУЕЛНИ БЛОК|GÖRSEL SATIR|LÍNEA VISUAL|VALINTALOHKO|VIDUMA BLOKO|VIDUMA LINIO|VISUAL BLOCK|VISUAL LÍNIA|VISUAL/BLOCO|VISUAL/LINHA|VISUALE RIGA|VISUEEL BLOK|VISUEL LIGNE|VISUEL LINJE|VISUELE BLOK|VISUELE REËL|ВИБІР РЯДКІВ|DÒNG VISUAL|GÖRSEL BLOK|KHỐI VISUAL|VALINTARIVI|VISUAL BLOC|VISUAL LINE|VISUEL BLOC|VISUEL BLOK|VISUELL RAD|ВИБІР БЛОКУ|RADHARCACH|VIZUÃLIS|VIZUÁLNE|VIZUÁLNÍ|WIZUALNY|ВИЗУЕЛНО|ビジュアル 矩形|VALINTA|VISUALE|VISUEEL|VISUELE|VISUELL|ビジュアル 行|GÖRSEL|VIDUMA|VISUAL|VISUEL|비주얼 라인|비주얼 블록|ВИБІР|ビジュアル|\[區塊\]|可视 块|可视 行|\[行\]|비주얼|可视|選取)( |$)'
row   = -1
col   = 0

# Select mode: a printable key replaces the selection, so it is typing.
[[mode_when]]
name  = "select"
mode  = "select"
regex = '^-- (\([^)]+\) )?(РЕЖИМ ВЫБОРКИ ПОСИМВОЛЬНЫЙ|РЕЖИМ ВЫБОРКИ ПОСТРОЧНЫЙ|РЕЖИМ ВЫБОРКИ БЛОКОВЫЙ|ZAZNACZANIE BLOKOWE|ZAZNACZANIE LINIOWE|SELECCIONAR BLOQUE|SELECCIONAR LÍNEA|SELECCIONAR LÍNIA|SELEÇÃO DE LINHAS|APARTIGITA BLOKO|APARTIGITA LINIO|KIVÃLASZT BLOKK|SELECCIONAR BLOC|SELEZIONA BLOCCO|SELEÇÃO EM BLOCO|ВИДІЛЕННЯ РЯДКІВ|ВЫДЕЛЕНИЕ СТРОКИ|SÉLECTION LIGNE|ВИДІЛЕННЯ БЛОКУ|ВЫДЕЛЕНИЕ БЛОКА|KIVÃLASZT SOR|SELECCIÓ LÍNIA|SELEZIONA RIGA|SÉLECTION BLOC|AUSWAHL BLOCK|AUSWAHL ZEILE|BLOC A ROGHNÚ|LÍNE A ROGHNÚ|LỰA CHỌN DÒNG|LỰA CHỌN KHỐI|MARKERA BLOCK|REGELSELECTIE|SELECCIÓ BLOC|BLOKSELECTIE|OZNAČ RIADOK|SELECT BLOCK|WALINTALOHKO|ИЗБОР ЛИНИЈА|MARKERA RAD|SELECCIONAR|SELECT LINE|WALINTARIVI|ZAZNACZANIE|ИЗБОР БЛОКА|KIVÃLASZT|OZNAČ BLOK|SELECTEREN|VELG BLOKK|VELG LINJE|VÆLG LINJE|KIES BLOK|KIES REËL|SATIR SEÇ|SELEZIONA|SÉLECTION|VÆLG BLOK|ВИДІЛЕННЯ|ВЫДЕЛЕНИЕ|APARTIGO|BLOK SEÇ|LỰA CHỌN|AUSWAHL|MARKERA|SELEÇÃO|WALINTA|ROGHNÚ|SELECT|라인 고르기|블록 고르기|SHODY|ZHODY|ИЗБОР|行指向選択|KIES|VELG|VÆLG|セレクト|矩形選択|选择 块|选择 行|選取區塊|SEÇ|選取行|고르기|选择)( |$)'
row   = -1
col   = 0

[[mode_when]]
name  = "replace"
mode  = "replace"
regex = '^-- (РЕЖИМ ВИРТУАЛЬНОЙ ЗАМЕНЫ|NAHRADIŤ VERTIKÁLNE|SUBSTITUIÇÃO VISUAL|ВИРТУАЛЬНАЯ ЗАМЕНА|REEMPLAZO VIRTUAL|SANAL DEĞİŞTİR|V-ANSTATAŬIGO|V-SOSTITUISCI|VREMPLACEMENT|REMPLACEMENT|SUBSTITUIÇÃO|РЕЖИМ ЗАМЕНЫ|ANSTATAŬIGO|SOSTITUISCI|SUBSTITUIRV|THAY THẾ ẢO|V-IONADAIGH|ВІРТ ЗАМІНА|REEMPLAZAR|SUBSTITUIR|V-ERSETZEN|V-ATHCHUR|V-ERSTATT|V-ZAMIANA|VERVANGEN|DEĞİŞTİR|ERSETZEN|NAHRADIŤ|THAY THẾ|VKORVAUS|VREPLACE|VVERVANG|ATHCHUR|ERSTATT|KORVAUS|REPLACE|VERSTAT|VERSÄTT|VERVANG|ZAMIANA|ВЗАМЕНА|ERSTAT|ERSÄTT|VCSERE|ЗАМІНА|ЗАМЕНА|CSERE|V-取代|V-替换|仮想置換|선택치환|바꾸기|取代|替换|置換)( |$)'
row   = -1
col   = 0

# neovim's terminal mode (plain vim shows nothing there).
[[mode_when]]
name  = "terminal"
mode  = "terminal"
regex = '^-- (TERMINAL|ТЕРМІНАЛ|UÇBİRİM|终端)( |$)'
row   = -1
col   = 0

# Any other marker: INSERT in any language, the completion submodes.
[[mode_when]]
name  = "insert"
mode  = "insert"
regex = '^-- \S'
row   = -1
col   = 0

[[mode_when]]
name = "command-line"
mode = "command"
  [[mode_when.clause]]
  regex = '^[:/?]'
  row   = -1
  col   = 0
  [[mode_when.clause]]
  cursor_rows = [-1, -1]

# cmdheight = 2: the command line opens on row -2 and clears the last row.
[[mode_when]]
name = "command-line-2"
mode = "command"
  [[mode_when.clause]]
  regex = '^[:/?]'
  row   = -2
  col   = 0
  [[mode_when.clause]]
  cursor_rows = [-2, -2]
  [[mode_when.clause]]
  regex = '^$'
  row   = -1

# Where tmux reports the cursor shape (3.6+; not 3.4 or 3.5), a bar cursor
# vetoes "normal" (neovim's default guicursor, or vim with t_SI/t_EI set).
[[corroborate]]
if_cursor_shape = "bar"
veto_modes      = ["normal", "visual"]
then_mode       = "insert"
confidence      = "low"
