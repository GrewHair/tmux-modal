# fzf — fuzzy finder (also skim, sk).
#
# Always insert: every letter typed goes to the query. Recognised by its
# command, and from the screen alone (over SSH, or when the pane's command
# is a wrapper such as fzf-tmux's) in two layouts: the default one (query
# on the last row, the match counter above it) and --reverse (query on the
# top row, the counter below it). --layout=reverse-list keeps the query at
# the bottom, like the default. --height runs inline on the primary screen,
# where only the command can tell. Checked against fzf 0.29, 0.38, 0.44.
name     = "fzf"
priority = 30
always   = "insert"
modes    = ["insert"]

[buckets]
typing = ["insert"]

[match]
command             = ["fzf", "sk"]
requires_alt_screen = false
combine             = "weighted"
# One layout's three clauses reach it; the cursor (the heaviest) is on one
# of the two rows only, so clauses of both layouts cannot add up to it.
threshold           = 100

  # Default layout. "  12/1000 ─────" (or "  12/1000 (3)" with selections)
  # just above the query row.
  [[match.clause]]
  regex  = '^  [0-9]+/[0-9]+( \([0-9]+\))?( [─-]{8,})?$'
  rows   = [-2, -2]
  weight = 30
  [[match.clause]]
  regex  = '^>( |$)'
  row    = -1
  weight = 30
  [[match.clause]]
  cursor_rows    = [-1, -1]
  cursor_visible = true
  weight         = 40

  # --reverse: the query on the top row, the counter just below it.
  [[match.clause]]
  regex  = '^  [0-9]+/[0-9]+( \([0-9]+\))?( [─-]{8,})?$'
  rows   = [1, 1]
  weight = 30
  [[match.clause]]
  regex  = '^>( |$)'
  row    = 0
  weight = 30
  [[match.clause]]
  cursor_rows    = [0, 0]
  cursor_visible = true
  weight         = 40
