# nnn — file manager. Hooks-only: nnn already moves with hjkl.
#
# Verified against nnn 4.9 (tests/fixtures/nnn). Row 0 shows the four
# contexts ("1 2 3 4 ~/path"), the last row "1/3 2026-09-27 15:54
# drwxr-xr-x 4K". The `/` filter and every prompt (rename C-r, new n, ...)
# show the cursor on the last row; it is hidden otherwise.
name     = "nnn"
priority = 50
extends  = ["slash-search", "curses-tui"]
modes    = ["normal", "insert"]
translated = false

[buckets]
typing     = ["insert"]
commanding = ["normal"]

[match]
command             = ["nnn"]
requires_alt_screen = true
combine             = "weighted"
threshold           = 100

  [[match.clause]]
  regex  = '^[1-4* ]*1 2 3 4 [/~]'
  row    = 0
  weight = 50

  [[match.clause]]
  regex  = '^[0-9]+/[0-9]+ [0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2} [-dlcbps][-rwxsStTl]{9}( |$)'
  row    = -1
  weight = 50

# (inherited: search `/`, cursor-on-prompt)
