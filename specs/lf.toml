# lf — file manager. Hooks-only: lf already moves with hjkl.
#
# Verified against lf r31 (tests/fixtures/lf). Row 0 shows "user@host:path",
# the last row the file's details and "1/3". Prompts on the last row show
# the cursor (hidden otherwise): `:` command, `/` `?` search, `rename: `,
# `!` `$` `%` `&` shell, `find: `, `mkdir: ` (user-defined).
name     = "lf"
priority = 50
extends  = ["colon-command", "slash-search", "curses-tui"]
modes    = ["normal", "insert", "command"]
translated = false

[buckets]
typing     = ["insert", "command"]
commanding = ["normal"]

[match]
command             = ["lf"]
requires_alt_screen = true
combine             = "weighted"
threshold           = 100

  [[match.clause]]
  regex  = '^[^ @:]+@[^ @:]+:[/~]'
  row    = 0
  weight = 50

  # Status bar: permissions, links, owner, group, size, full date ... "n/m".
  [[match.clause]]
  regex  = '^[-dlcbps][-rwxsStTl]{9} .* [A-Z][a-z]{2} [A-Z][a-z]{2} [ 0-9][0-9] [0-9]{2}:[0-9]{2}:[0-9]{2} [0-9]{4} .* [0-9]+/[0-9]+$'
  row    = -1
  weight = 50

# (inherited: command-line `:`, search `/` `?`, cursor-on-prompt)
