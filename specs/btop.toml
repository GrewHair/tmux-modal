# btop — resource monitor. Key-remapping: btop's process list moves with
# the arrow keys only (unless its own `vim_keys` option is on).
#
# Verified against btop 1.2.3, 1.2.13 and 1.3.0 at 120x40 and 80x24
# (tests/fixtures/btop).
# The cursor is always hidden; btop draws its own. Everything is in boxes
# whose titles carry superscript numbers: ¹cpu ²mem ³net ⁴proc. The
# process filter (f or /) is edited in the proc box title:
#   ⁴proc┌┐filter┌──   idle
#   ⁴proc┌┐f bto  ↵┌   typing the filter (↵ = Enter to apply; ↲ in 1.2.3)
#   ⁴proc┌┐f bto del┌  filter applied: navigable again
# The options screen (o, F2) has editable text fields (Enter edits the
# selected one), so it counts as insert as a whole: no remapping there,
# use the arrow keys. The main menu, help, and the signal list (s, whose
# arrows choose a signal) are navigable.
name     = "btop"
priority = 50
extends  = "curses-tui"
modes    = ["normal", "insert"]
translated = false

[match]
command             = ["btop", "bpytop"]
requires_alt_screen = true
combine             = "weighted"
threshold           = 50          # the required proc box + one other box

  # The process box: the filter lives in its title, so it must be btop's.
  [[match.clause]]
  regex  = '⁴proc┌'
  rows   = [0, -2]
  weight = "required"

  [[match.clause]]
  regex  = '^╭─┐¹cpu┌'
  rows   = [0, -2]
  weight = 50

  [[match.clause]]
  regex  = '╭─┐²mem┌'
  rows   = [0, -2]
  weight = 50

  [[match.clause]]
  regex  = '^╭─┐³net┌'
  rows   = [0, -2]
  weight = 50

# --- mode detection: first hit wins, no hit => normal -----------------
[[insert_when]]
name  = "filter"
regex = '⁴proc┌┐f .* [↵↲]┌'
rows  = [0, -2]

# The options screen's tab row ("[general]  2cpu  3gpu ..."); it covers
# the proc box, so it is recognised only once btop is (sticky).
[[insert_when]]
name  = "options"
regex = '│ +(\[general\]|1general) +(\[cpu\]|2cpu)( |$)'
rows  = [0, -2]

# The help overlay also covers the proc box; it is navigable.
[[mode_when]]
name  = "help"
mode  = "normal"
regex = '│ +Key: +Description:( |$)'
rows  = [0, -2]

# (inherited from curses-tui: cursor-on-prompt, which never fires: btop
# hides the terminal cursor)

[keys]
h     = "Left"                    # btop: Left/Right choose the sort column
j     = "Down"
k     = "Up"
l     = "Right"
g     = "Home"
G     = "End"
"C-d" = "PageDown"
"C-u" = "PageUp"

[escape]
leader = "_"

# btop's own bindings that the map shadows; reach them with the leader
# (_h, _k). Documentation only. (btop's vim_keys option moves them to H/K.)
[shadowed]
h = "help"
k = "kill the selected process (SIGKILL)"
