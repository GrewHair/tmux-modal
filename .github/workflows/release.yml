name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check VERSION matches the tag
        run: test "v$(cat VERSION)" = "${GITHUB_REF_NAME}"
      - name: Build static binaries
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 linux/arm darwin/amd64 darwin/arm64 freebsd/amd64; do
            os=${target%/*}; arch=${target#*/}
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=$(cat VERSION)" \
              -o "dist/tmux-modal-$os-$arch" ./cmd/tmux-modal
          done
          (cd dist && sha256sum tmux-modal-* > SHA256SUMS)
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="$(cat VERSION)" '/^## /{p = ($2 == v); next} p' CHANGELOG.md > notes.md
          test -s notes.md || { echo "no CHANGELOG.md section for $(cat VERSION)"; exit 1; }
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md
